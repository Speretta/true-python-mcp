name: cargo-cache
description: >-
  First-party composite action: cache the cargo directories and build tree
  keyed on Cargo.lock. Shared by the CI jobs to avoid repeating the block
  five times; no third-party actions.

inputs:
  suffix:
    description: Extra cache key segment ("" for the shared key, "msrv" for the MSRV job)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache the cargo dirs and the build tree
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo${{ inputs.suffix }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo${{ inputs.suffix }}-
