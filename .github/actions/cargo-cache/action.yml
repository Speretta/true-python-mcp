name: cargo-cache
description: >-
  First-party composite action: cache the cargo directories (every OS) and
  the build tree (where rebuilding costs more than the cache) keyed on
  Cargo.lock. Shared by the CI and release jobs to avoid repeating the block;
  no third-party actions.

inputs:
  suffix:
    description: Extra cache key segment ("" for the shared key, "msrv" for the MSRV job)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache the cargo directories
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry${{ inputs.suffix }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-registry${{ inputs.suffix }}-

    # The build tree is cached only where the cache is cheaper than a rebuild.
    # Measured on this repo's CI (2026-10-26): restore + save costs ~2+2 min
    # on Linux but ~13+13 min on Windows, against an ~8-12 min cold build.
    # On Windows the cache was the slowest part of the job, so Windows builds
    # from scratch and keeps only the registry cache above.
    - name: Cache the build tree (not on Windows)
      if: runner.os != 'Windows'
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-target${{ inputs.suffix }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-target${{ inputs.suffix }}-
