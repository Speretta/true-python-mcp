name: Nightly

# Stress the property suite far beyond CI's fast gate (256 cases): 65536
# cases per property, in debug AND release — the v0.1.4 gate failure
# surfaced only in a release-profile roll, so one profile is thin evidence.
# When a run persists new seeds into tests/property.proptest-regressions,
# they are committed back so every future run replays them (the bench bot's
# push pattern). Scheduled workflows run on the default branch only.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  property-stress:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "65536"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cargo-cache
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$HOME/.cargo/bin"
      # The properties are pure Rust (no ground-truth python needed).
      - name: Stress the properties (debug)
        run: cargo nextest run -E 'binary(property)'
      - name: Stress the properties (release)
        run: cargo nextest run --release -E 'binary(property)'
      - name: Commit any new regression seeds
        # Run even when the stress failed: a new seed is written only when a
        # property FAILS, so this step must not be skipped on failure — that is
        # exactly when there is something to persist.
        if: always()
        run: |
          if ! git diff --quiet tests/property.proptest-regressions; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/property.proptest-regressions
            # No [skip ci]: the persisted seeds must be re-verified by CI on
            # this very commit, so a real bug surfaces immediately instead of
            # on the next unrelated push.
            git commit -m "test: persist new property regression seeds"
            git pull --rebase
            git push
          fi
