name: CI

on:
  push:
    branches: [main]
  pull_request:

# Successive pushes to the same ref cancel the older run. Tag pushes never
# reach this workflow; the release pipeline has its own test gate and its
# own never-cancelling concurrency group (release.yml).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TPMCP_GROUND_TRUTH_PYTHON: /tmp/nbenv/bin/python
  TPMCP_REQUIRE_GROUND_TRUTH: "1"
  TPMCP_LOCK_DIR: /tmp/tpmcp-ci-locks

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The only actions we use are first-party; they run on the runner's
      # Node 24 runtime.
      - uses: actions/checkout@v5
      - name: Cache the cargo dirs and the build tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # No Node-based setup actions: the runner image already ships a stable
      # Rust toolchain with clippy and rustfmt, and uv installs via shell.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Ground-truth tracks the LATEST nbformat and marimo on every run:
      # the byte-exact serializer oracle and the graph findings are
      # continuously re-verified against the current releases, and a
      # release that changes behavior turns CI red the same day — the
      # intended early warning, not noise. The ground-truth python stays
      # pinned at 3.12 so the runner image migration cannot float it.
      - name: Install the ground-truth venv (nbformat + marimo)
        run: |
          uv venv --python 3.12 /tmp/nbenv
          uv pip install --python /tmp/nbenv/bin/python nbformat marimo
      # Official nextest binary via curl; no third-party GitHub Actions
      # beyond checkout and cache (house rule).
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$HOME/.cargo/bin"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run
      - run: cargo build --release

  # Cargo.toml declares rust-version; this job is the only place that
  # compiles with it. Check only: clippy and the suite ride the stable job.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache the cargo dirs and the MSRV build tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Check the crate with the declared MSRV
        run: cargo +1.97.0 check --locked

  # The release workflow ships two Windows targets; this job is the only
  # place the suite runs on Windows. nextest only: fmt and clippy are
  # platform-independent and stay in the Linux job. .gitattributes keeps the
  # byte-exact fixtures untouched by the runner's core.autocrlf=true.
  # Paths go through GITHUB_ENV (runner temp dir) because the workflow-level
  # env above spells Linux paths.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TPMCP_REQUIRE_GROUND_TRUTH: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Cache the cargo dirs and the build tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Separate step on purpose: GITHUB_PATH only takes effect with the
      # NEXT step, so calling uv inside the install step dies with 127
      # (proven by the first windows run of 2026-10-19).
      - name: Install the pinned ground-truth venv
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/nbenv"
          uv pip install --python "$RUNNER_TEMP/nbenv/Scripts/python.exe" nbformat marimo
      - name: Point the ground-truth env at the venv and a job-local lock dir
        shell: bash
        run: |
          echo "TPMCP_GROUND_TRUTH_PYTHON=$RUNNER_TEMP/nbenv/Scripts/python.exe" >> "$GITHUB_ENV"
          echo "TPMCP_LOCK_DIR=$RUNNER_TEMP/tpmcp-locks" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/latest/windows-tar | tar zxf - -C "$HOME/.cargo/bin"
      - run: cargo nextest run
