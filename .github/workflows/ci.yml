name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TPMCP_GROUND_TRUTH_PYTHON: /tmp/nbenv/bin/python
  TPMCP_REQUIRE_GROUND_TRUTH: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The only action we use; it runs on the runner's Node 24 runtime.
      - uses: actions/checkout@v5
      # No Node-based setup actions: the runner image already ships a stable
      # Rust toolchain with clippy and rustfmt, and uv installs via shell.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the ground-truth venv (nbformat + marimo)
        run: |
          uv venv /tmp/nbenv
          uv pip install --python /tmp/nbenv/bin/python nbformat marimo
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
