[package]
name = "tpmcp"
version = "0.2.0"
edition = "2024"
description = "MCP server for Python: byte-exact Jupyter/marimo notebook editing and built-in ruff lint/format for any .py file"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Speretta/true-python-mcp"
readme = "README.md"
keywords = ["mcp", "jupyter", "marimo", "notebook", "ruff"]
categories = ["development-tools", "command-line-utilities"]
# Repo machinery that crate consumers do not need; everything the README
# and COMPARISON.md quote (examples, licenses, changelog) stays in.
exclude = [".githooks", ".github", "bench", "scripts"]
rust-version = "1.97"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fd-lock = "4"
rmcp = { version = "3.5", features = ["transport-io"] }
ruff_db = { version = "=0.0.18", features = ["os"] }
ruff_diagnostics = "=0.0.18"
ruff_linter = "=0.17.1"
ruff_notebook = "=0.0.18"
ruff_python_ast = "=0.0.18"
ruff_python_formatter = "=0.0.18"
ruff_python_parser = "=0.0.18"
ruff_python_stdlib = "=0.0.18"
ruff_source_file = "=0.0.18"
ruff_text_size = "=0.0.18"
ruff_workspace = "=0.0.18"
rustc-hash = "2"
salsa = "0.28.5"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
similar = "3.2.0"
stacker = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ty_module_resolver = "=0.0.18"
ty_python_core = "=0.0.18"
ty_python_semantic = "=0.0.18"
ty_site_packages = "=0.0.18"
ty_vendored = "=0.0.18"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Production code must be panic-free: no unwrap/expect/panic outside tests.
# Test modules and integration tests re-allow them (assertion idiom).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
